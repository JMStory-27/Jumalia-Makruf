<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lawnime — Offline</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07070e; }
  body {
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
  }
  .icon {
    width: 84px; height: 84px; border-radius: 24px; margin-bottom: 24px;
    background: linear-gradient(135deg,#FF6B00,#FFB800);
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    box-shadow: 0 12px 32px rgba(255,107,0,0.35);
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #8B93A8; font-size: 14px; max-width: 320px; line-height: 1.6; margin: 0 0 24px; }
  button {
    background: linear-gradient(135deg,#FF6B00,#F97316); color: #fff; border: none;
    padding: 12px 28px; border-radius: 999px; font-weight: 700; font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Kamu sedang offline</h1>
  <p>Koneksi internet terputus. Episode dan halaman yang pernah dibuka sebelumnya tetap bisa diakses — coba kembali ke beranda atau tunggu koneksi pulih.</p>
  <button onclick="location.reload()">Coba Lagi</button>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>

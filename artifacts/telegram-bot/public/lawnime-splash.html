<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lawnime ID</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    /* Single flat color — glow handled by fixed canvas overlay only */
    background: #0c0228;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    position: relative;
    color: white;
    height: 100dvh;
  }

  #starsCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  /* Single full-screen glow centered — no seam, no split */
  .aura {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 85% 55% at 50% 45%, rgba(115,45,255,0.38) 0%, rgba(80,20,190,0.15) 55%, transparent 78%);
    z-index: 1; pointer-events: none;
    animation: aP 4s ease-in-out infinite;
  }
  @keyframes aP { 0%,100%{opacity:.8;} 50%{opacity:1;} }

  /* sparkles */
  .sp {
    position: fixed; pointer-events: none; z-index: 5;
    font-size: var(--sz,20px); color: var(--c,#a78bfa);
    filter: drop-shadow(0 0 8px currentColor);
    animation: spA var(--d,2s) var(--dl,0s) ease-in-out infinite;
  }
  @keyframes spA {
    0%,100%{opacity:0;transform:scale(.5) rotate(-8deg);}
    45%,55%{opacity:1;transform:scale(1.2) rotate(12deg);}
  }

  /* ── Character: fills screen width, clipped by JS ── */
  .char-wrap {
    position: relative; z-index: 2;
    width: 100%;
    overflow: hidden;
    flex-shrink: 0;
    /* NO margin-bottom — text sits directly below */
    animation: floatChar 3.8s ease-in-out infinite;
  }
  @keyframes floatChar {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-18px); }
  }
  .char-img {
    display: block; width: 100%; height: auto;
    filter:
      drop-shadow(0 14px 70px rgba(105,42,245,0.72))
      drop-shadow(0 0 130px rgba(80,20,200,0.30));
  }

  /* ── Bottom: sits IMMEDIATELY below character, no gap ── */
  .bottom {
    position: relative; z-index: 3;
    display: flex; flex-direction: column;
    align-items: center;
    /* tight padding — text hugs character */
    padding: 10px 16px 16px;
    gap: 8px;
    width: 100%;
    flex-shrink: 0;
    /* no background here — body color handles it uniformly */
  }

  .subtitle {
    font-size: clamp(13px, 4vw, 17px);
    color: rgba(215,195,255,0.84);
    letter-spacing: .3px; line-height: 1;
    margin-top: 2px;
  }
  .brand {
    font-size: clamp(30px, 10vw, 46px);
    font-weight: 900;
    background: linear-gradient(90deg,#a78bfa 0%,#c084fc 35%,#818cf8 65%,#a78bfa 100%);
    background-size: 220% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 26px rgba(167,139,250,1)) drop-shadow(0 0 60px rgba(167,139,250,0.45));
    animation: shimmer 2.8s linear infinite;
    display: flex; align-items: center; gap: 10px; line-height: 1;
  }
  @keyframes shimmer { to { background-position: 220% center; } }
  .bstar {
    font-size: .52em; -webkit-text-fill-color: #c084fc;
    filter: drop-shadow(0 0 9px #a78bfa);
    animation: bsA 2.4s ease-in-out infinite; display: inline-block;
  }
  @keyframes bsA {
    0%,100%{transform:scale(1) rotate(0deg);opacity:.7;}
    50%    {transform:scale(1.5) rotate(20deg);opacity:1;}
  }

  .loading-row {
    display: flex; align-items: center; gap: 6px;
    font-size: clamp(11px,3.2vw,13px); color: rgba(200,180,255,.6);
  }
  .ldot {
    width:6px;height:6px;border-radius:50%;
    background:#a78bfa;box-shadow:0 0 8px #a78bfa;
    animation:ldP 1.1s ease-in-out infinite;
  }
  @keyframes ldP{0%,100%{opacity:.35;transform:scale(.75);}50%{opacity:1;transform:scale(1.25);}}

  .bar-track {
    width:min(230px,62vw);height:4px;
    border-radius:999px;background:rgba(255,255,255,.09);
  }
  .bar-fill {
    height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,#6d28d9,#a78bfa,#c084fc);
    box-shadow:0 0 18px rgba(167,139,250,.9);
    transition:width .1s linear;
  }
  .cdown {
    font-size:clamp(11px,3vw,13px);color:rgba(200,180,255,.5);
    display:flex;align-items:center;gap:4px;
  }
  .cnum{font-weight:700;color:rgba(210,190,255,.8);}
</style>
</head>
<body>

<canvas id="starsCanvas"></canvas>
<div class="aura"></div>

<!-- Sparkles — full screen -->
<div class="sp" style="top:3%;left:5%;--d:2.3s;--dl:0s;--c:#a78bfa;--sz:23px">✦</div>
<div class="sp" style="top:6%;right:6%;--d:1.9s;--dl:.5s;--c:#c084fc;--sz:19px">✦</div>
<div class="sp" style="top:18%;left:3%;--d:2.7s;--dl:1s;--c:#818cf8;--sz:14px">✧</div>
<div class="sp" style="top:24%;right:4%;--d:2s;--dl:.3s;--c:#a78bfa;--sz:17px">✦</div>
<div class="sp" style="top:40%;left:2%;--d:3.1s;--dl:.9s;--c:#c084fc;--sz:12px">✦</div>
<div class="sp" style="top:44%;right:2%;--d:2.5s;--dl:1.4s;--c:#818cf8;--sz:13px">✧</div>
<div class="sp" style="top:11%;left:16%;--d:1.7s;--dl:.2s;--c:#c084fc;--sz:10px">★</div>
<div class="sp" style="top:15%;right:15%;--d:2.1s;--dl:.8s;--c:#a78bfa;--sz:10px">★</div>
<div class="sp" style="top:32%;left:7%;--d:2.9s;--dl:1.3s;--c:#818cf8;--sz:11px">✦</div>
<div class="sp" style="top:37%;right:7%;--d:2.2s;--dl:.6s;--c:#c084fc;--sz:11px">✦</div>
<div class="sp" style="top:63%;left:4%;--d:2.6s;--dl:.4s;--c:#a78bfa;--sz:12px">✦</div>
<div class="sp" style="top:67%;right:5%;--d:2.0s;--dl:1.1s;--c:#c084fc;--sz:11px">✧</div>
<div class="sp" style="top:80%;left:9%;--d:3.2s;--dl:.7s;--c:#818cf8;--sz:10px">✦</div>
<div class="sp" style="top:84%;right:10%;--d:1.8s;--dl:1.6s;--c:#a78bfa;--sz:9px">★</div>
<div class="sp" style="top:92%;left:28%;--d:2.4s;--dl:.3s;--c:#c084fc;--sz:8px">✧</div>
<div class="sp" style="top:89%;right:25%;--d:2.8s;--dl:1.2s;--c:#818cf8;--sz:9px">✦</div>

<!-- Character -->
<div class="char-wrap" id="charWrap">
  <img id="charImg" src="lawnime-girl-nobg.png" class="char-img" alt="Lawnime Girl" draggable="false">
</div>

<!-- Text immediately below character -->
<div class="bottom">
  <div class="subtitle">Selamat Datang di</div>
  <div class="brand">
    <span class="bstar">✦</span>Lawnime ID<span class="bstar" style="animation-delay:.7s">✦</span>
  </div>
  <div class="loading-row"><span class="ldot"></span>Loading...</div>
  <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  <div class="cdown"><span>⊙</span><span class="cnum" id="cnum">5</span><span>detik</span></div>
</div>

<script>
/* ─── Clip character to just above baked-in text, maximise size ─── */
function applyClip() {
  const wrap = document.getElementById('charWrap');
  const img  = document.getElementById('charImg');
  if (!img.naturalWidth) return;

  const screenH   = window.innerHeight;
  const imgW      = img.offsetWidth;
  const fullImgH  = imgW * (img.naturalHeight / img.naturalWidth);

  // Baked-in text starts at ~72% of image height.
  // Show as much as possible without revealing it.
  const clipH = fullImgH * 0.72;

  // But never let character take more than 75% of screen
  // (leave at least 25% for text below)
  wrap.style.height = Math.min(clipH, screenH * 0.75) + 'px';
}

const img = document.getElementById('charImg');
if (img.complete && img.naturalWidth) applyClip();
else img.addEventListener('load', applyClip);
window.addEventListener('resize', applyClip);

/* ─── Stars ─── */
(function(){
  const c=document.getElementById('starsCanvas'),ctx=c.getContext('2d');
  let W,H;
  const r=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};
  r(); window.addEventListener('resize',r);
  const P=['rgba(200,170,255,','rgba(155,110,255,','rgba(240,230,255,','rgba(120,75,220,','rgba(180,140,255,'];
  const s=Array.from({length:85},()=>({
    x:Math.random(), y:Math.random(),
    r:.3+Math.random()*1.7,
    col:P[Math.random()*P.length|0],
    ph:Math.random()*Math.PI*2,
    sp:.4+Math.random()*1.5
  }));
  let last=0;
  (function draw(ts){
    const dt=(ts-last)/1000; last=ts;
    ctx.clearRect(0,0,W,H);
    for(const st of s){
      st.ph+=dt*st.sp;
      const a=.08+.92*(.5+.5*Math.sin(st.ph));
      ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r,0,Math.PI*2);
      ctx.fillStyle=st.col+a+')'; ctx.fill();
    }
    requestAnimationFrame(draw);
  })(0);
})();

/* ─── Progress + countdown + redirect ─── */
(function(){
  const TOTAL=5000, bar=document.getElementById('barFill'), num=document.getElementById('cnum');
  const t0=performance.now();
  (function tick(ts){
    const e=ts-t0;
    bar.style.width=Math.min(e/TOTAL*100,100)+'%';
    num.textContent=Math.max(Math.ceil((TOTAL-e)/1000),0);
    e<TOTAL ? requestAnimationFrame(tick) : (window.location.href='home.html');
  })(t0);
})();
</script>
</body>
</html>

kind = "web"
previewPath = "/lawrenz-ai/"
title = "Lawrenz AI"
version = "1.0.0"
id = "artifacts/lawrenz-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/lawrenz-ai/" ]
localPort = 24661

[services.development]
run = "pnpm --filter @workspace/lawrenz-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lawrenz-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/lawrenz-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24661"
BASE_PATH = "/lawrenz-ai/"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#09090f"/>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e0a4a"/>
      <stop offset="100%" stop-color="#09090f"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="210" r="130" fill="rgba(124,58,237,0.15)"/>
  <g filter="url(#glow)">
    <g transform="rotate(-40, 256, 210)">
      <rect x="248" y="90" width="16" height="180" rx="4" fill="url(#blade1)"/>
      <rect x="220" y="262" width="72" height="12" rx="4" fill="#a78bfa"/>
      <rect x="247" y="274" width="18" height="48" rx="4" fill="#7c3aed"/>
    </g>
    <g transform="rotate(40, 256, 210)">
      <rect x="248" y="90" width="16" height="180" rx="4" fill="url(#blade2)"/>
      <rect x="220" y="262" width="72" height="12" rx="4" fill="#a78bfa"/>
      <rect x="247" y="274" width="18" height="48" rx="4" fill="#7c3aed"/>
    </g>
    <defs>
      <linearGradient id="blade1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e2e8f0"/>
        <stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
      <linearGradient id="blade2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e2e8f0"/>
        <stop offset="100%" stop-color="#a855f7"/>
      </linearGradient>
    </defs>
  </g>
  <circle cx="130" cy="130" r="3" fill="#a78bfa" opacity="0.8"/>
  <circle cx="382" cy="110" r="4" fill="#c4b5fd" opacity="0.6"/>
  <circle cx="100" cy="320" r="2" fill="#7c3aed" opacity="0.7"/>
  <circle cx="410" cy="300" r="3" fill="#a78bfa" opacity="0.5"/>
  <text x="256" y="418" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="48" fill="#7c3aed" text-anchor="middle" letter-spacing="2">DUNGEON</text>
  <text x="256" y="468" font-family="Arial Black, Arial, sans-serif" font-weight="900"
    font-size="40" fill="#a78bfa" text-anchor="middle" letter-spacing="3">WORLD</text>
</svg>
